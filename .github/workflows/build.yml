name: Build TACZ 1.21.4
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.12
      - name: Build
        run: |
          (gradle build --stacktrace --no-daemon 2>&1 | tee build.log) ; exit ${PIPESTATUS[0]}
      - name: Dump API signatures
        if: always()
        run: bash scripts/dump-api.sh || true
      - name: Extract errors
        if: always()
        run: grep -E "error:|FAILED|Could not resolve|What went wrong" -A2 build.log | head -400 > errors.txt || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-log
          path: |
            build.log
            errors.txt
            api-signatures.txt
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: tacz-1.21.4
          path: build/libs/*.jar
